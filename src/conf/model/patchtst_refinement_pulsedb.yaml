# PatchTST refinement model configuration for PulseDB dataset
# This file is loaded when model=patchtst_refinement_pulsedb is specified

defaults:
  - base_patchtst
  - _self_

# Model architecture parameters for PatchTST (Patch Time Series Transformer)
# These parameters control the architecture and behavior of the PatchTST model

# Context and patch configuration
input_length: 1285 # Length of the input waveform sequence

# Transformer configuration
d_model: 1024  # Dimensionality of the patch embeddings
num_encoder_layers: 16  # Number of transformer encoder layers
num_heads: 16  # Number of self-attention heads in the multi-head attention module

# Additional parameters
num_targets: 2  # Number of target values to predict

dictionary_key: y_pred_bp