name: mdvisco
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core Python environment
  - python=3.10
  - pip
  
  # PyTorch and CUDA
  - pytorch=2.5
  - torchvision=0.20
  - torchaudio=2.5
  - pytorch-cuda=12.1
  - cuda-cudart
  - cuda-libraries
  - cuda-runtime
  
  # Scientific computing
  - numpy-base=1.24
  - scipy=1.9
  - pandas=1.4
  - scikit-learn=1.1
  - h5py
  - mkl
  
  # Deep learning frameworks
  - transformers=4.39
  - tokenizers=0.15
  - safetensors=0.4
  - timm=1.0
  - einops=0.8
  
  # Configuration and utilities
  - hydra-core=1.3
  - omegaconf=2.3
  - tqdm=4.64
  - wandb=0.19
  - seaborn=0.13
  - fsspec
  
  # Signal processing
  - neurokit2
  
  # Data utilities
  - dotmap=1.3
  - mat73=0.62
  
  # Development tools
  - pytest=8.4
  - black=24.1
  - isort=5.13
  - autopep8
  - autoflake
  - docformatter
  - ruff
  - flake8=7.0
  - flake8-bugbear
  - flake8-comprehensions
  - flake8-docstrings
  - flake8-pyproject
  - mypy=1.8
  - pyright
  
  # Pip-only packages
  - pip:
      - pyppg==1.0.73
